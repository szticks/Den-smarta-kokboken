name: Deploy Apps Script Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.clasp.json'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_CONTENT: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC_CONTENT" > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --deploymentId AKfycbyfU4HGJIPm2dmHaLXtsVKKtUflAcqekGaUBL472DLYXD8yh0bf6Mi4SM4hiHF0wl9TEA --description "Auto-deploy from GitHub Actions (${{ github.sha }})"
